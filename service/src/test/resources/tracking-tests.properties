# db
# real host/username/password are injected at runtime from HIBERNATE_CONNECTION_HOST /
# HIBERNATE_CONNECTION_USERNAME / HIBERNATE_CONNECTION_PASSWORD env vars (see .env.example)
hibernate.connection.host=
hibernate.connection.port=3306
hibernate.connection.db=trackingdev
hibernate.connection.username=
hibernate.connection.password=
hibernate.dialect=org.hibernate.dialect.MySQLInnoDBDialect


#mail
mail.smtp.from=tracking@tracking.com
# real values are injected at runtime from MAIL_USER / MAIL_PASSWORD env vars (see .env.example)
mail.user=
mail.password=
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.allow.send=false

# thread pool
thread.size=4

#credentials
# real test-account id/password are injected at runtime from AUTH_USER_ID / AUTH_USER_PASSWORD env vars
auth.user.id=
auth.user.password=

client.version=1.0.1

tmw.auth.token.expiration=720

#tracking server
# real login/password are injected at runtime from TRACKING_SERVER_LOGIN / TRACKING_SERVER_PASSWORD env vars
tracking.server.login=
tracking.server.password=
tracking.server.url=http://crawlerloadbalancer-393756136.eu-central-1.elb.amazonaws.com
tracking.server.track.api.url=crawler/track
tracking.server.auction.api.url=crawler/auction
tracking.server.port=

