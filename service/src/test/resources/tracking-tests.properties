# db
# These are real hibernate.* property names, so EntityManagerProvider's call to
# Persistence.createEntityManagerFactory(unitName, Utils.getProperties()) — which passes this
# whole file as an overrides map — makes them win over persistence.xml's MySQL settings
# whenever tracking.env=tests. That's what keeps the test suite off the real dev database:
# it runs against a disposable in-memory H2 instance instead. DB_CLOSE_DELAY=-1 keeps the
# in-memory DB alive for the whole JVM run rather than vanishing when a pooled connection closes.
hibernate.connection.url=jdbc:h2:mem:tracking_test;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
hibernate.connection.driver_class=org.h2.Driver
hibernate.connection.username=sa
hibernate.connection.password=
hibernate.dialect=org.hibernate.dialect.H2Dialect
hibernate.hbm2ddl.auto=create-drop


